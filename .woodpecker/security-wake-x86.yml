when:
  - event: push
    branch: main
  - event: manual
    evaluate: '(BUILD_IOS ?? "") == ""'

labels:
  platform: linux/arm64
  hostname: orangepi5

skip_clone: true

workspace:
  base: /tmp
  path: woodpecker-wake-x86

steps:
  - name: wake-docker-x86
    image: curlimages/curl:8.22.0

    commands:
      - |
        set -eu

        echo "===== WAKE VM104 ====="

        RESPONSE="$(
          curl \
            -fsS \
            --connect-timeout 5 \
            --max-time 180 \
            -X POST \
            https://energy-manager.brunnoserver.duckdns.org/cgi-bin/ci-wake-docker-x86
        )"

        printf '%s\n' "$RESPONSE"

        case "$RESPONSE" in
          *"RESULT=trigger_complete"*|*"RESULT=already_in_progress"*)
            echo "SECURITY_WAKE_X86=PASS"
            ;;
          *)
            echo "SECURITY_WAKE_X86=FAIL"
            exit 1
            ;;
        esac
