when:
  - event: push
    branch: main
  - event: manual

labels:
  platform: linux/amd64
  role: build-linux

depends_on:
  - security-wake-x86

steps:
  - name: android-manual-request
    image: alpine:3.22.1

    commands:
      - |
        set -e

        case "$BUILD_ANDROID" in
          ""|staging|production)
            ;;
          *)
            echo "BUILD_ANDROID_INVALID=$BUILD_ANDROID"
            exit 1
            ;;
        esac

        if [ -n "$BUILD_ANDROID" ] && [ -n "$BUILD_IOS" ]; then
          echo "ANDROID_IOS_SIMULTANEOUS_REQUEST=FAIL"
          exit 1
        fi

        if [ -z "$BUILD_ANDROID" ]; then
          echo "BUILD_ANDROID=quality-only"
        else
          echo "BUILD_ANDROID=$BUILD_ANDROID"
        fi

        echo "ANDROID_MANUAL_REQUEST=PASS"

    when:
      - event: manual

  - name: android-quality
    image: app-react-native-android-ci:36-jdk17-bun1.3.14-v3
    pull: false

    environment:
      CI: "true"
      GRADLE_USER_HOME: /cache/gradle
      BUN_INSTALL_CACHE_DIR: /cache/bun

    volumes:
      - /opt/ci-cache/app-react-native/gradle:/cache/gradle
      - /opt/ci-cache/app-react-native/bun:/cache/bun

    commands:
      - |
        set -e

        echo "===== ANDROID CI ENVIRONMENT ====="
        uname -m
        java -version
        node --version
        bun --version

        echo
        echo "===== CACHE ====="
        echo "GRADLE_USER_HOME=$GRADLE_USER_HOME"
        echo "BUN_INSTALL_CACHE_DIR=$BUN_INSTALL_CACHE_DIR"
        echo "CI_REPO_TRUSTED_VOLUMES=$CI_REPO_TRUSTED_VOLUMES"

        echo
        echo "===== SOURCE ====="
        git rev-parse HEAD

        echo
        echo "===== INSTALL ====="
        bun install --frozen-lockfile

        echo
        echo "===== ANDROID QUALITY ====="
        bun run quality:android

        echo
        echo "ANDROID_PIPELINE_GATE=PASS"

  - name: android-build
    image: app-react-native-android-ci:36-jdk17-bun1.3.14-v3
    pull: false

    environment:
      CI: "true"
      GRADLE_USER_HOME: /cache/gradle
      BUN_INSTALL_CACHE_DIR: /cache/bun

    volumes:
      - /opt/ci-cache/app-react-native/gradle:/cache/gradle
      - /opt/ci-cache/app-react-native/bun:/cache/bun

    commands:
      - |
        set -e

        set -a
        . ./ci/artifacts.env
        set +a

        echo "===== ANDROID MANUAL BUILD ====="
        echo "BUILD_ANDROID=$BUILD_ANDROID"
        echo "ARTIFACT_BASENAME=$ARTIFACT_BASENAME"

        APP_ENV="$BUILD_ANDROID" \
        EXPO_PUBLIC_APP_ENV="$BUILD_ANDROID" \
          bun run build:apk

        ARTIFACT="$ARTIFACT_BASENAME-$BUILD_ANDROID.apk"

        test -s "$ARTIFACT"
        ls -lh "$ARTIFACT"

        echo "ANDROID_MANUAL_BUILD=PASS"

    when:
      - evaluate: 'CI_PIPELINE_EVENT == "manual" && BUILD_ANDROID == "staging"'
      - evaluate: 'CI_PIPELINE_EVENT == "manual" && BUILD_ANDROID == "production"'
