when:
  - event: pull_request
    branch: main
  - event: push
    branch: main

labels:
  platform: linux/amd64
  role: build-linux

depends_on:
  - security-wake-x86

steps:
  - name: cpd-baseline
    image: app-react-native-android-ci:36-jdk17-bun1.4.4-v1
    pull: false
    environment:
      CI: "true"
      BUN_INSTALL_CACHE_DIR: /cache/bun
    volumes:
      - /opt/ci-cache/app-react-native/bun:/cache/bun
    commands:
      - sh scripts/ci/arn3-quality-cpd.sh
