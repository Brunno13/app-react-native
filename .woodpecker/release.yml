when:
  - event: tag

labels:
  platform: darwin/arm64

steps:
  # =========================================================
  # NOTIFICAÇÃO DE INÍCIO
  # =========================================================

  - name: notify-start
    image: bash

    environment:
      GOTIFY_TOKEN:
        from_secret: gotify_token

    commands:
      - |
        TIMESTAMP="$(TZ=BRT3 date '+%d/%m/%Y %H:%M')"

        curl -fsS \
          --connect-timeout 5 \
          --max-time 10 \
          --output /dev/null \
          -X POST \
          "https://gotify.brunnoserver.duckdns.org/message?token=$$GOTIFY_TOKEN" \
          -F "title=WoodpeckerCI" \
          -F "message=WoodpeckerCI · App-react-native · Production pipeline started · Tag ${CI_COMMIT_TAG} · $${TIMESTAMP}" \
          -F "priority=5" \
          || true

  # =========================================================
  # FASE 1: TESTES, E2E E BUILD DOS ARTEFATOS
  # =========================================================

  - name: build-artifacts
    image: bash

    environment:
      EXPO_PUBLIC_API_URL:
        from_secret: api_url_production

      EXPO_PUBLIC_APP_ENV: "production"

    commands:
      # =====================================================
      # AMBIENTE NATIVO MACOS
      # =====================================================

      - echo "🔧 Preparando ambiente nativo do macOS..."

      - |
        export PATH="/Users/brunno/.nvm/versions/node/v22.22.2/bin:/opt/homebrew/bin:$PATH"
        export NODE_BINARY="/Users/brunno/.nvm/versions/node/v22.22.2/bin/node"

        echo
        echo "===== NODE ====="

        which node
        node --version

        if [ ! -x "$NODE_BINARY" ]; then
          echo "❌ Node esperado não encontrado:"
          echo "$NODE_BINARY"
          exit 1
        fi

        if [ "$(node --version)" != "v22.22.2" ]; then
          echo "❌ Node incorreto."
          echo "Esperado: v22.22.2"
          echo "Atual: $(node --version)"
          exit 1
        fi

        node -e "
          if (
            typeof Array.prototype.toReversed !== 'function'
          ) {
            console.error(
              '❌ Array.prototype.toReversed não disponível.'
            );
            process.exit(1);
          }

          console.log(
            '✅ Node suporta Array.prototype.toReversed.'
          );
        "

        echo
        echo "===== BUN ====="

        which bun
        bun --version

        echo
        echo "===== JAVA ====="

        which java
        java -version

        echo
        echo "===== XCODE ====="

        xcodebuild -version

        echo
        echo "===== DISCO ====="

        df -h /

        echo
        echo "===== DISCO TEMP ====="

        df -h /private/var/folders \
          || true

      # =====================================================
      # DEPENDÊNCIAS
      # =====================================================

      - echo "📦 Instalando dependências do projeto..."

      - >
        bun install
        --frozen-lockfile
        --registry https://registry.npmjs.org
        --network-concurrency 8

      # =====================================================
      # QUALITY GATE
      # =====================================================

      - echo "🧹 Verificando Arquitetura FSD e Linter..."
      - bun run lint

      - echo "🔎 Validando TypeScript..."
      - ./node_modules/.bin/tsc --noEmit

      - echo "🧪 Executando a suíte de testes unitários..."
      - bun run test

      # =====================================================
      # ANDROID
      # =====================================================

      - echo "🤖 Compilando o APK Android de Produção..."

      - |
        echo
        echo "===== NODE ANTES DO ANDROID ====="

        which node
        node --version

        echo
        echo "NODE_BINARY=$NODE_BINARY"

        echo
        echo "===== DISCO ANTES DO ANDROID ====="

        df -h /

      - bun run build:apk:prod

      - |
        echo
        echo "===== DISCO APÓS ANDROID ====="

        df -h /

        echo
        echo "===== APK ANDROID ====="

        ls -lah \
          ./app-react-native-production.apk

      # =====================================================
      # IOS E2E / DETOX
      # =====================================================

      - echo "⚔️ Compilando aplicativo iOS instrumentado para Detox..."

      - |
        echo
        echo "===== NODE ANTES DO DETOX ====="

        which node
        node --version

        echo
        echo "NODE_BINARY=$NODE_BINARY"

      - >
        ./node_modules/.bin/detox
        build
        --configuration ios.sim.release

      - echo "⚔️ Executando testes E2E no Simulador iOS..."

      - >
        ./node_modules/.bin/detox
        test
        --configuration ios.sim.release
        --cleanup

      - |
        echo
        echo "===== DISCO APÓS DETOX ====="

        df -h /

      # =====================================================
      # IOS FINAL
      #
      # O build do Detox utiliza DETOX_ENABLED=true.
      # Os artefatos gerados acima não devem ser publicados.
      #
      # Após o E2E, removemos os artefatos instrumentados
      # e geramos novamente o pacote iOS de produção.
      # =====================================================

      - echo "🧹 Removendo artefatos temporários do Detox..."

      - rm -rf ios_build
      - rm -f app-react-native-ios-production.zip

      - echo "🍎 Compilando o pacote iOS final de Produção..."

      - bun run build:ios:prod

      # =====================================================
      # VALIDAÇÃO DOS ARTEFATOS FINAIS
      # =====================================================

      - echo "🔎 Validando artefatos finais..."

      - |
        set -e

        test -f \
          ./app-react-native-production.apk

        test -f \
          ./app-react-native-ios-production.zip

        echo
        echo "===== ANDROID ====="

        ls -lah \
          ./app-react-native-production.apk

        echo
        echo "===== IOS ====="

        ls -lah \
          ./app-react-native-ios-production.zip

        echo
        echo "===== VALIDANDO ZIP IOS ====="

        unzip -tq \
          ./app-react-native-ios-production.zip

        echo
        echo "===== DISCO FINAL ====="

        df -h /

        echo
        echo "✅ Artefatos finais validados."

  # =========================================================
  # FASE 2: ATUALIZAÇÃO OTA DE PRODUÇÃO
  # =========================================================

  - name: deploy-ota-update
    image: bash

    environment:
      EXPO_PUBLIC_API_URL:
        from_secret: api_url_production

      EXPO_PUBLIC_APP_ENV: "production"

      EXPO_TOKEN:
        from_secret: expo_token

      CI: "true"

      EAS_NO_VCS: "1"

    commands:
      - |
        set -e

        export PATH="/Users/brunno/.nvm/versions/node/v22.22.2/bin:/opt/homebrew/bin:$PATH"
        export NODE_BINARY="/Users/brunno/.nvm/versions/node/v22.22.2/bin/node"

        echo
        echo "===== OTA ENVIRONMENT ====="

        echo
        echo "===== NODE ====="
        which node
        node --version

        if [ "$(node --version)" != "v22.22.2" ]; then
          echo "❌ Node incorreto na etapa OTA."
          echo "Esperado: v22.22.2"
          echo "Atual: $(node --version)"
          exit 1
        fi

        node -e "
          if (
            typeof Array.prototype.toReversed !== 'function'
          ) {
            console.error(
              '❌ Array.prototype.toReversed não disponível.'
            );
            process.exit(1);
          }

          console.log(
            '✅ Node suporta Array.prototype.toReversed.'
          );
        "

        echo
        echo "===== BUN ====="
        which bun
        bun --version

        echo
        echo "===== EAS UPDATE ====="

        bunx eas-cli update \
          --branch production \
          --message "Release da versão ${CI_COMMIT_TAG}" \
          --non-interactive

  # =========================================================
  # FASE 3: RELEASE NO GITEA
  # =========================================================

  - name: gerar-release-notes
    image: bash

    environment:
      GITEA_TOKEN:
        from_secret: gitea_token

      GITEA_API_BASE:
        from_secret: gitea_api_base

    commands:
      - |
        set -eu

        echo "===== GITEA RELEASE ====="

        test -n "$$GITEA_TOKEN"
        test -n "$$GITEA_API_BASE"

        # Aceita o secret com ou sem "/" no final.
        GITEA_API_BASE="$${GITEA_API_BASE%/}"

        echo
        echo "===== RELEASE HISTORY ====="

        git config \
          remote.origin.fetch \
          "+refs/heads/*:refs/remotes/origin/*"

        if [ "$$(git rev-parse --is-shallow-repository)" = "true" ]; then
          git fetch --all --unshallow
        else
          git fetch --all
        fi

        git fetch --tags

        PREV_TAG="$$( \
          git describe \
            --tags \
            --abbrev=0 \
            HEAD^ \
            2>/dev/null \
            || true \
        )"

        if [ -z "$$PREV_TAG" ]; then
          CHANGELOG="$$( \
            git log \
              --pretty=format:"- %h %s" \
          )"
        else
          CHANGELOG="$$( \
            git log \
              --pretty=format:"- %h %s" \
              "$$PREV_TAG..HEAD" \
          )"
        fi

        RELEASE_BODY="$$( \
          printf \
            '🚀 Deploy automático multiplataforma Android e iOS realizado nativamente pelo Apple Silicon M1.\n\n---\n\n%s' \
            "$$CHANGELOG" \
        )"

        printf '%s\n' \
          "$$RELEASE_BODY" \
          > .release_body.txt

        JSON_PAYLOAD="$$( \
          jq \
            -n \
            --arg tag "${CI_COMMIT_TAG}" \
            --arg name "Versão ${CI_COMMIT_TAG}" \
            --arg body "$$RELEASE_BODY" \
            '{
              tag_name: $tag,
              name: $name,
              body: $body
            }' \
        )"

        echo
        echo "===== CREATE GITEA RELEASE ====="

        RESPONSE="$$( \
          curl \
            --silent \
            --show-error \
            -X POST \
            "$$GITEA_API_BASE/repos/${CI_REPO_OWNER}/${CI_REPO_NAME}/releases" \
            -H "Accept: application/json" \
            -H "Authorization: token $$GITEA_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$$JSON_PAYLOAD" \
        )"

        RELEASE_ID="$$( \
          printf '%s' "$$RESPONSE" \
            | jq -r '.id' \
        )"

        if [ "$$RELEASE_ID" = "null" ] || \
           [ -z "$$RELEASE_ID" ]; then

          echo "GITEA_RELEASE_CREATE=FAIL"
          echo "Resposta recebida:"
          printf '%s\n' "$$RESPONSE"
          exit 1
        fi

        echo "GITEA_RELEASE_ID=$$RELEASE_ID"
        echo "GITEA_RELEASE_CREATE=PASS"

        echo
        echo "===== VERIFICANDO ARTEFATOS ====="

        test -s ./app-react-native-production.apk
        test -s ./app-react-native-ios-production.zip

        ls -lah \
          ./app-react-native-production.apk \
          ./app-react-native-ios-production.zip

        echo
        echo "===== UPLOAD GITEA ARTIFACTS ====="

        curl -fsS \
          -X POST \
          "$$GITEA_API_BASE/repos/${CI_REPO_OWNER}/${CI_REPO_NAME}/releases/$$RELEASE_ID/assets?name=app-react-native-production.apk" \
          -H "Authorization: token $$GITEA_TOKEN" \
          -F "attachment=@./app-react-native-production.apk"

        echo "GITEA_ANDROID_UPLOAD=PASS"

        curl -fsS \
          -X POST \
          "$$GITEA_API_BASE/repos/${CI_REPO_OWNER}/${CI_REPO_NAME}/releases/$$RELEASE_ID/assets?name=app-react-native-ios-production.zip" \
          -H "Authorization: token $$GITEA_TOKEN" \
          -F "attachment=@./app-react-native-ios-production.zip"

        echo "GITEA_IOS_UPLOAD=PASS"

        echo
        echo "============================================================"
        echo " GITEA RELEASE SUMMARY"
        echo "============================================================"
        printf '%-32s %s\n' "Release creation" "PASS"
        printf '%-32s %s\n' "Android artifact" "PASS"
        printf '%-32s %s\n' "iOS artifact" "PASS"
        echo "============================================================"
        echo "GITEA_RELEASE=PASS"

  # =========================================================
  # FASE 4: ESPELHAMENTO PARA O GITHUB
  # =========================================================

  - name: espelhar-github
    image: bash

    environment:
      GITHUB_USER: Brunno13

      GITHUB_TOKEN:
        from_secret: github_token

    commands:
      - echo "=== SINCRONIZANDO REPOSITÓRIO COM O GITHUB ==="

      - >
        git config
        --global
        --add
        safe.directory
        "*"

      - >
        git config
        --global
        http.postBuffer
        524288000

      - >
        GIT_TERMINAL_PROMPT=0
        git
        -c credential.helper=
        push
        https://$${GITHUB_TOKEN}@github.com/$${GITHUB_USER}/${CI_REPO_NAME}.git
        HEAD:main
        --force

      - >
        GIT_TERMINAL_PROMPT=0
        git
        -c credential.helper=
        push
        https://$${GITHUB_TOKEN}@github.com/$${GITHUB_USER}/${CI_REPO_NAME}.git
        ${CI_COMMIT_TAG}
        --force

  # =========================================================
  # FASE 5: RELEASE NO GITHUB
  # =========================================================

  - name: criar-release-github
    image: bash

    environment:
      GITHUB_USER: Brunno13

      GITHUB_TOKEN:
        from_secret: github_token

    commands:
      - |
        set -e

        echo "=== CRIANDO RELEASE NO GITHUB ==="

        GITHUB_API_URL="https://api.github.com/repos/${GITHUB_USER}/${CI_REPO_NAME}/releases"

        if [ -f .release_body.txt ]; then
          RELEASE_BODY=$(
            cat .release_body.txt
          )
        else
          RELEASE_BODY="🚀 Lançamento automatizado sincronizado a partir do servidor Gitea interno."
        fi

        JSON_PAYLOAD=$(
          jq \
            -n \
            --arg tag "${CI_COMMIT_TAG}" \
            --arg name "Versão ${CI_COMMIT_TAG}" \
            --arg body "$RELEASE_BODY" \
            '{
              tag_name: $tag,
              name: $name,
              body: $body
            }'
        )

        RESPONSE=$(
          curl \
            -s \
            -X POST \
            "$GITHUB_API_URL" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD"
        )

        RELEASE_ID=$(
          printf '%s' "$RESPONSE" \
          | jq -r '.id'
        )

        if [ "$RELEASE_ID" = "null" ] \
          || [ -z "$RELEASE_ID" ]; then

          echo "❌ ERRO: O GitHub não retornou um ID válido."
          echo "Resposta recebida: $RESPONSE"
          exit 1
        fi

        echo
        echo "=== INICIANDO UPLOAD DOS ARTEFATOS NO GITHUB ==="

        GH_UPLOAD_URL="https://uploads.github.com/repos/${GITHUB_USER}/${CI_REPO_NAME}/releases/${RELEASE_ID}/assets"

        curl \
          -fsS \
          -X POST \
          "${GH_UPLOAD_URL}?name=app-react-native-production.apk" \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "Content-Type: application/vnd.android.package-archive" \
          --data-binary \
          "@./app-react-native-production.apk"

        curl \
          -fsS \
          -X POST \
          "${GH_UPLOAD_URL}?name=app-react-native-ios-production.zip" \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "Content-Type: application/zip" \
          --data-binary \
          "@./app-react-native-ios-production.zip"

        echo
        echo "✅ RELEASE NO GITHUB CRIADA COM SUCESSO!"

  # =========================================================
  # NOTIFICAÇÕES FINAIS
  # =========================================================

  - name: notify-success
    image: bash

    environment:
      GOTIFY_TOKEN:
        from_secret: gotify_token

    commands:
      - |
        TIMESTAMP="$(TZ=BRT3 date '+%d/%m/%Y %H:%M')"

        curl -fsS \
          --connect-timeout 5 \
          --max-time 10 \
          --output /dev/null \
          -X POST \
          "https://gotify.brunnoserver.duckdns.org/message?token=$$GOTIFY_TOKEN" \
          -F "title=WoodpeckerCI" \
          -F "message=WoodpeckerCI · App-react-native · Production pipeline finished successfully · Tag ${CI_COMMIT_TAG} · $${TIMESTAMP}" \
          -F "priority=5" \
          || true

    when:
      - event: tag
        status: [success]

  - name: notify-error
    image: bash

    environment:
      GOTIFY_TOKEN:
        from_secret: gotify_token

    commands:
      - |
        TIMESTAMP="$(TZ=BRT3 date '+%d/%m/%Y %H:%M')"

        curl -fsS \
          --connect-timeout 5 \
          --max-time 10 \
          --output /dev/null \
          -X POST \
          "https://gotify.brunnoserver.duckdns.org/message?token=$$GOTIFY_TOKEN" \
          -F "title=WoodpeckerCI" \
          -F "message=WoodpeckerCI · App-react-native · Production pipeline failed · Tag ${CI_COMMIT_TAG} · $${TIMESTAMP}" \
          -F "priority=8" \
          || true

    when:
      - event: tag
        status: [failure]
