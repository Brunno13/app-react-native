# Diagnostico manual e sem release. Nao roda automaticamente por push ou tag.
when:
  - event: manual

labels:
  platform: darwin/arm64

steps:
  - name: mac-mini-native-preflight
    image: bash
    commands:
      - |
        set -eu
        echo '===== RUNNER ====='
        hostname
        uname -m
        sw_vers

        # Apenas o smoke e restrito ao host de migracao; os pipelines
        # de producao continuam usando somente platform: darwin/arm64.
        if ! hostname | grep -Fqx 'Mac-mini.lan'; then
          echo 'RUNNER_HOST=FAIL: workflow nao foi executado no Mac Mini'
          exit 1
        fi
        uname -m | grep -Fqx 'arm64'
        echo 'RUNNER=PASS'

        echo '===== GIT CHECKOUT ====='
        test -f package.json
        git rev-parse --is-inside-work-tree
        git rev-parse --short HEAD
        echo 'CHECKOUT=PASS'

        echo '===== NODE 22 ====='
        command -v node
        node --version
        if ! node --version | grep -Eq '^v22\.'; then
          echo 'NODE_MAJOR=FAIL: necessario Node 22.x'
          exit 1
        fi
        echo 'NODE_MAJOR=PASS'

        echo '===== BUN ====='
        command -v bun
        bun --version

        echo '===== XCODE ====='
        xcode-select -p
        xcodebuild -version

        echo '===== COCOAPODS ====='
        command -v pod
        pod --version

        echo 'MACOS_AGENT_SMOKE=PASS'
